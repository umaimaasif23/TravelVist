<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TravelVista</title>
    <link rel="stylesheet" href="booking.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="booking-form-section" style="max-width: 450px; margin: 80px auto;">
        <div class="form-header">
            <h2><i class="fa-solid fa-user-lock"></i> Login / Sign Up</h2>
            <p>Please login to continue your luxury booking</p>
        </div>
        <div class="grand-booking-form" style="display: flex; flex-direction: column; gap: 15px;">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="fatima@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Minimum 6 characters" required>
            </div>
            <button id="loginBtn" class="btn-submit-reservation">Login</button>
            <button id="signupBtn" class="btn-submit-reservation" style="background: #D4AF37;">Create New Account</button>
            <p id="msg" style="text-align:center; color: #008080;"></p>
        </div>
    </div>
    <script type="module" src="login.js"></script>
</body>
</html>
